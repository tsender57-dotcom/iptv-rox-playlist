name: Auto Update Playlist XC 1 (Mydroon)
on:
  schedule:
    - cron: '0 */12 * * *' # Berjalan otomatis setiap 12 Jam
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Repositori
        uses: actions/checkout@v3

      - name: Siapkan Mesin Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Buat dan Eksekusi Skrip Xtream API
        run: |
          cat << 'EOF' > update_xc1.py
          import os, json, urllib.request
          from datetime import datetime

          # Kredensial hasil ekstraksi dari URL
          HOST = "http://sts.mydroon.com:8080"
          USER = "9127491274"
          PASS = "QDXDbuLzFDYaYbD"
          OUTPUT_FILE = "MyIPTV/playlistXC1.m3u8"

          def fetch_json(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'IPTVSmartersPro'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read().decode('utf-8', errors='ignore'))
              except Exception:
                  return None

          def process():
              # Mengambil daftar kategori
              cats = fetch_json(f"{HOST}/player_api.php?username={USER}&password={PASS}&action=get_live_categories")
              if not cats: cats = []
              cat_map = {str(c.get("category_id")): c.get("category_name", "Uncategorized") for c in cats if isinstance(c, dict)}

              # Mengambil daftar siaran
              streams = fetch_json(f"{HOST}/player_api.php?username={USER}&password={PASS}&action=get_live_streams")
              if not streams:
                  print("Gagal mengambil stream Xtream API!")
                  return

              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
              
              # Mendata semua group title unik yang aktif
              active_groups = set()
              for s in streams:
                  if isinstance(s, dict):
                      cat_id = str(s.get("category_id", ""))
                      active_groups.add(cat_map.get(cat_id, "Uncategorized"))
              
              sorted_groups = sorted(list(active_groups))
              
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  f.write("# ==========================================\n")
                  f.write(f"# TYPE: Direct Xtream API (Playlist XC 1)\n")
                  f.write(f"# GENERATED: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
                  f.write("# ==========================================\n")
                  f.write("# DAFTAR GROUP TITLE:\n")
                  
                  # Menulis daftar group title berjejer ke bawah
                  for i, g in enumerate(sorted_groups):
                      if i < len(sorted_groups) - 1:
                          f.write(f"# {g},\n")
                      else:
                          f.write(f"# {g}\n")
                          
                  f.write("# ==========================================\n\n")
                  
                  # Merakit tautan
                  for s in streams:
                      if not isinstance(s, dict): continue
                      ch_id = str(s.get("stream_id", ""))
                      if not ch_id: continue
                      
                      name = s.get("name", "Unknown Channel").strip()
                      logo = s.get("stream_icon", "")
                      cat_id = str(s.get("category_id", ""))
                      group = cat_map.get(cat_id, "Uncategorized")
                      
                      # Tautan menggunakan format .ts sesuai permintaan asli
                      xc_link = f"{HOST}/live/{USER}/{PASS}/{ch_id}.ts"
                      f.write(f'#EXTINF:-1 group-title="{group}" tvg-logo="{logo}", {name}\n')
                      f.write(f"{xc_link}\n")
              print("File playlistXC1.m3u8 berhasil dibuat!")

          process()
          EOF
          python update_xc1.py
          rm update_xc1.py

      - name: Simpan ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MyIPTV/
          git commit -m "Auto Update Playlist XC 1 (Mydroon)" || echo "Tidak ada perubahan"
          git push
