name: Auto Update Akun 11 (CloudCDN)
on:
  schedule:
    - cron: '0 */6 * * *' # Berjalan otomatis setiap 6 Jam
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Tarik Repositori
        uses: actions/checkout@v3

      - name: Siapkan Mesin Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Unduh Data MAC Portal 11
        run: |
          curl -s -H "Cookie: mac=00:1A:79:07:07:43" -A "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3" "http://tv.cloudcdn.me/c/server/load.php?type=itv&action=get_all_channels" -o mac_channels11.json
          curl -s -H "Cookie: mac=00:1A:79:07:07:43" -A "Mozilla/5.0 (QtEmbedded; U; Linux; C) AppleWebKit/533.3 (KHTML, like Gecko) MAG200 stbapp ver: 2 rev: 250 Safari/533.3" "http://tv.cloudcdn.me/c/server/load.php?type=itv&action=get_genres" -o mac_genres11.json

      - name: Buat dan Eksekusi Skrip Akun 11
        run: |
          cat << 'EOF' > update11.py
          import os, json
          from datetime import datetime

          # Konfigurasi Akun 11
          HOST = "http://tv.cloudcdn.me"
          MAC_ADDRESS = "00:1A:79:07:07:43"
          UID = "10223"
          OUTPUT_FILE = "MyIPTV/playlist11.m3u"

          def load_genres():
              genre_map = {}
              try:
                  with open("mac_genres11.json", "r", encoding="utf-8") as f:
                      for g in json.load(f).get("js", []):
                          if g.get("id") and g.get("title"):
                              genre_map[str(g.get("id"))] = g.get("title")
              except Exception: pass
              return genre_map

          def process_channels():
              genre_map = load_genres()
              try:
                  with open("mac_channels11.json", "r", encoding="utf-8") as f:
                      channels = json.load(f).get("js", {}).get("data", [])
              except Exception: return
              if not channels: return

              os.makedirs(os.path.dirname(OUTPUT_FILE), exist_ok=True)
              
              # Mendata semua group title unik
              active_groups = set()
              for channel in channels:
                  ch_group = genre_map.get(str(channel.get("tv_genre_id", "")), "Uncategorized")
                  active_groups.add(ch_group)
              
              sorted_groups = sorted(list(active_groups))
              
              with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
                  f.write("#EXTM3U\n")
                  f.write("# ==========================================\n")
                  f.write(f"# TYPE: MAC Portal Direct TS (AKUN 11)\n")
                  f.write(f"# GENERATED: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\n")
                  f.write("# ==========================================\n")
                  f.write("# DAFTAR GROUP TITLE:\n")
                  
                  # Menulis daftar group title berjejer ke bawah
                  for i, g in enumerate(sorted_groups):
                      if i < len(sorted_groups) - 1:
                          f.write(f"# {g},\n")
                      else:
                          f.write(f"# {g}\n")
                          
                  f.write("# ==========================================\n\n")
                  
                  # Memproses dan merakit URL direct .ts
                  for channel in channels:
                      ch_id = str(channel.get("id", ""))
                      if not ch_id: continue
                      
                      ch_name = channel.get("name", "Unknown Channel").strip()
                      ch_logo = channel.get("logo", "")
                      ch_group = genre_map.get(str(channel.get("tv_genre_id", "")), "Uncategorized")
                      
                      # Tautan format langsung yang kebal blokir
                      direct_link = f"{HOST}/live.ts?channelId={ch_id}&uid={UID}&deviceMac={MAC_ADDRESS}"
                      
                      f.write(f'#EXTINF:-1 group-title="{ch_group}" tvg-logo="{ch_logo}", {ch_name}\n')
                      f.write(f"{direct_link}\n")
              
              print("File playlist11.m3u berhasil dibuat!")

          process_channels()
          EOF
          python update11.py
          rm update11.py mac_channels11.json mac_genres11.json

      - name: Simpan ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add MyIPTV/
          git commit -m "Auto Update Akun 11 (Format Direct .ts)" || echo "Tidak ada perubahan"
          git push
